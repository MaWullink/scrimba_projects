<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,200..800;1,200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="main-block">
      <div class="upper-block">
        <h1>Generate a <span class="green">random password</span></h1>
        <p id="sub-title">Never use an insecure password again.</p>
        <button onclick="getPassword()" class="btn">Generate passwords</button>
      </div>

      <div class="password-container">
        <div id="password-one" class="password-box"><p></p></div>
        <div id="password-two" class="password-box"><p></p></div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
