<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jimmy's Dinner</title>

    <link rel="stylesheet" href="./styles/index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Smythe&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <div class="header-text">
          <h1>Jimmy's Dinner</h1>
          <p>The best burgers and pizzas in town.</p>
        </div>
      </header>

      <main>
        <!-- MENU -->
        <section class="menu">
          <div id="menu-container"></div>
        </section>

        <!-- ORDER -->
        <section class="order-section" id="order-section">
          <h2>Your order</h2>

          <div id="order-items"></div>
          <div id="order-total"></div>

          <button id="complete-order" class="complete-order">
            Complete order
          </button>
        </section>
      </main>
    </div>

    <script type="module" src="./js/index.js"></script>
  </body>
</html>
